# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
# the Zenodo concept record (read from zenodo.org on 2026-11-11, v0.1.0 archived)
zenodo_concept = "24125198"
title = "ARA"
dual = ["core/", "tools/"]
trust_boundary = """
The decoder of ARA's control headers: `core/ara-ant.cc` `decodeAnt`, which the
ns-3 adapter reaches through `DecodeAntPacket` (`ns3/model/ara-header.cc`) for
every payload on the control port. It reads exactly one 16-byte forward or
backward ant with `swarm-core`'s bounds-checked little-endian readers, and
refuses a wrong version byte, an unknown type, a short buffer or trailing bytes
(org invariant 3); a refused payload is dropped without touching the routing
state. Roundtrip and seeded fuzz tests cover it in `core/test/` and
`ns3/test/`. The duplicate-error and route-error signals of [G02] §3.2-3.3
are not written yet (#5)."""
limitations = """
- **ARA has no authentication** (Güneş, Sorges & Bouazizi, 2002). Any node can
  forge forward or backward ants, and so pheromone, or drop the traffic it
  relays (blackhole, greyhole). Out of scope, as in AntHocNet before its
  default-off security profile (AntHocNet ADR-0020).
- A simulation protocol for ns-3, not a network stack for real radios."""

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "ARA, the Ant-Colony-Based Routing Algorithm (Güneş, Sorges & Bouazizi, 2002), as a standalone swarm routing protocol for MANETs: planned as a simulator-agnostic C++ core and an ns-3 contrib module on swarm-core, with a paper-fidelity sheet."
homepage = "https://swarm-routing.github.io/arena/ARA/"
topics = ["ara", "ant-colony-optimization", "aco", "swarm-intelligence", "manet", "ad-hoc-routing", "routing-protocol", "ns-3", "network-simulation"]
ruleset = "protocol"
required_checks = ["check / org-sync", "title / title", "headers / licence", "core", "ci / ns-latest debug", "ci / ns-latest sanitized", "ci / format", "swarm-core / pin"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true

# The work this repository implements or builds on: the README's Releases &
# citing list and CITATION.cff's references (swarm-routing/.github org-sync,
# #228). Every DOI confirmed with lit_search.py confirm; fields from Crossref.

[[references]]
type = "conference-paper"
title = "ARA-the ant-colony based routing algorithm for MANETs"
authors = ["Güneş, M.", "Sorges, U.", "Bouazizi, I."]
year = 2002
venue = "Proceedings. International Conference on Parallel Processing Workshop"
pages = "79-85"
publisher = "IEEE"
doi = "10.1109/ICPPW.2002.1039715"
role = "The algorithm this repository implements; docs/fidelity.md maps each of its sections to the code and marks the repository choices."
