name: Benchmark cell
# The label `ns3-campaign dispatch` finds a run by.
run-name: ${{ inputs.label || inputs.cell || 'benchmark cell' }}

# One benchmark cell of ARA's paired campaigns (#36, epic
# swarm-routing/.github#156): a thin caller of swarm-routing/.github's
# reusable-benchmark-cell.yml (swarm-routing/.github#157) in build mode.
# Whatever ref it is dispatched at, the cell checks out `source_sha` and fails
# unless HEAD is that commit, then builds, in the ns3-dev image given by
# digest (the plans name an `-optimized` one):
#
#   swarm-core     at the commit core/CMakeLists.txt pins (SWARM_CORE_REF).
#                  The `swarm-core / pin` check covers the line below, so it
#                  is bumped with the pin; swarm-core main's model/ may be
#                  newer, the cell builds the pinned commit;
#   routing-bench  (the harness) at the commit below, the same for every arm
#                  of a campaign dispatched at one ref;
#   ara            from ns3/ at `source_sha`.
#
# Both arms of a change test (base and change, tools/bench/campaigns/) are
# dispatched at the plan's `ref`, so they share this file's dependency pins
# and differ only in `source_sha`: the paired delta is ARA's own. A PR that
# bumps a dependency dispatches at its own branch (plan `ref`), so both arms
# build the new one. ##PROV## modules= records every commit.
#
# Campaigns go through `ns3-campaign` (swarm-routing/ns3-tools), which
# dispatches this workflow with image, source_sha, harness, args, cell and
# label (AGENTS.md "Build & verify"). The artifact `benchmark-cell`
# (results.txt with ##ARGS##/##PROV##) is kept 7 days.
#
# The safe pattern of the reusable cell (swarm-routing/.github#160):
# workflow_dispatch only, `contents: read, packages: read`, no secrets passed,
# no cache, no other job.
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'ns3-dev image by digest: ghcr.io/swarm-routing/ns3-dev@sha256:<64 hex> (an -optimized one for numbers)'
        required: true
      source_sha:
        description: '40-char ARA commit every cell checks out, whatever the dispatch ref'
        required: true
      harness:
        description: 'The harness program'
        default: routing-compare
      args:
        description: 'The harness flags, verbatim (e.g. --scenario=paper --runs=20 --firstRun=1 --protocols=ara)'
        required: true
      seeds:
        description: 'RngRun range <first>-<last>; empty = in args'
        default: ''
      cell:
        description: 'Cell name ([a-z0-9][a-z0-9._-]*)'
        default: ''
      label:
        description: 'Run name (<generation>/<arm>/<cell>), set by ns3-campaign'
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  # No timeout-minutes here: a job that only calls a reusable workflow cannot
  # take one; the reusable cell's job carries it (360, the run step 340).
  cell:
    permissions:
      contents: read
      packages: read
    uses: swarm-routing/.github/.github/workflows/reusable-benchmark-cell.yml@main
    with:
      image: ${{ inputs.image }}
      source_sha: ${{ inputs.source_sha }}
      harness: ${{ inputs.harness }}
      args: ${{ inputs.args }}
      seeds: ${{ inputs.seeds }}
      cell: ${{ inputs.cell }}
      modules: ara=ns3
      dependencies: |
        swarm-core=swarm-routing/ns3-swarm-core@3ced81506bd906163dc83f5825d77ca170609dfb
        routing-bench=swarm-routing/ns3-tools@3d279b83392a00288050574cee4288f30205658b:ns3/routing-bench
