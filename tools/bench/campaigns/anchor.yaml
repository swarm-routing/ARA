#
# ARA's anchor (#36; the third gate of org rule 6): the paper's own trend,
# from docs/fidelity.md "Anchor candidate" (Güneş, Sorges & Bouazizi 2002,
# https://doi.org/10.1109/icppw.2002.1039715, §4, Figs. 4, 6, 8), as decided
# on #4 (2026-11-09 and 2026-11-10): v2.5.0's scenario and pass rule, run
# again on the new core/ with >= 20 paired seeds.
#
#   Trend: at high mobility (pause 0 and 30 s) ARA delivers more than AODV
#   and has the lower routing overhead; at low mobility they are close.
#   Rule (pre-registered, v2.5.0's): paired by seed, ARA minus AODV; PDR with
#   its 95 % CI above zero at pause 0 and at pause 30; NRL with its 95 % CI
#   below zero at pause 0. The 120 s and 600 s cells are reported, not gated,
#   as are the raw routing-packet counts and nrl_bytes (Fig. 8 plots counts,
#   Fig. 6 bits per data bit; docs/fidelity.md).
#
# Scenario ([G02] §4.1-4.2, the rest repo choices recorded in the sheet):
# 50 nodes, 1500 m x 300 m, 802.11 at 2 Mbit/s, 300 m disk range, random
# waypoint 1-10 m/s, 900 s, 10 CBR flows of 64 B at 1 packet/s
# (`--scenario=paper`, v2.5.0's command lines with --runs/--firstRun for the
# seeds), pauses 0, 30, 120 and 600 s (four of the paper's seven, as v2.5.0).
# ARA and stock ns-3 AODV run in the same invocation, so every seed pairs them
# on the same mobility and traffic.
#
# NOT DISPATCHED YET: the anchor waits for ARA's route-failure backtracking
# slice (#5). There is no `source_sha` on purpose, so `ns3-campaign dispatch`
# refuses this plan; #5 sets it to the commit under test when it
# pre-registers the run (this file, committed before dispatch).
#
# One arm: the comparison is between two protocols in one cell, not between
# two commits. `ns3-campaign verdicts` on a change plan pairs arms, not
# protocols, so it prints nothing for this plan; the ARA-minus-AODV paired
# read is an open item of #36 (the PR lists it).
#
#   P=tools/bench/campaigns/anchor.yaml
#   ns3-campaign plan     $P
#   ns3-campaign dispatch $P --wait           # after #5 sets source_sha
#   ns3-campaign status   $P --brief
#   ns3-campaign collect  $P --out .campaign/anchor/cells
generation: anchor
ref: main
repo: swarm-routing/ARA
workflow: benchmark-cell.yml
program: routing-compare
# ns3-dev:3.48-optimized on 2026-11-13: AODV-family arms stay on 3.48 while
# ns-3.49's AODV livelocks (swarm-routing/ns3-containers#35; docs/fidelity.md).
image: ghcr.io/swarm-routing/ns3-dev@sha256:5585a93c5cea1980592539e2d26a4e111e0ff4b0cc63b3dfd6ea5de459d80d3f
# 8 jobs of 10 seeds; at most 4 cell runs at once, so PR CI keeps runners.
cap: 4
control: ara

arms:
  ara: ""

# 20 seeds per cell (RngRun 1..20) in two jobs of 10 (blocks: --firstRun=1
# and --firstRun=11), as v2.5.0 split its 900 s cells.
x-field: &field "--scenario=paper --nNodes=50 --time=900 --areaX=1500 --areaY=300 --speed=10 --flows=10 --runs=10 --diag --protocols=ara,aodv"
cells:
  # gated: PDR (ARA - AODV) CI > 0; NRL (ARA - AODV) CI < 0
  anchor-p0: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: *field, extraArgs: "--pause=0"}, blocks: [1, 11]}
  # gated: PDR (ARA - AODV) CI > 0
  anchor-p30: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: *field, extraArgs: "--pause=30"}, blocks: [1, 11]}
  # reported, not gated
  anchor-p120: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: *field, extraArgs: "--pause=120"}, blocks: [1, 11]}
  anchor-p600: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: *field, extraArgs: "--pause=600"}, blocks: [1, 11]}

jobs:
  - {arms: [ara], cells: "*"}
