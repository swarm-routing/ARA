#
# ARA's anchor (#36; the third gate of org rule 6): the paper's own trend,
# from docs/fidelity.md "Anchor candidate" (Güneş, Sorges & Bouazizi 2002,
# https://doi.org/10.1109/icppw.2002.1039715, §4, Figs. 4, 6, 8), as decided
# on #4 (2026-11-09 and 2026-11-10): v2.5.0's scenario and pass rule, run
# again on the new core/ with >= 20 paired seeds.
#
#   Trend: at high mobility (pause 0 and 30 s) ARA delivers more than AODV
#   and has the lower routing overhead; at low mobility they are close.
#   Rule (pre-registered, v2.5.0's): paired by seed, ARA minus AODV; PDR with
#   its 95 % CI above zero at pause 0 and at pause 30; NRL with its 95 % CI
#   below zero at pause 0. The 120 s and 600 s cells are reported, not gated,
#   as are the raw routing-packet counts and nrl_bytes (Fig. 8 plots counts,
#   Fig. 6 bits per data bit; docs/fidelity.md).
#
# Scenario ([G02] §4.1-4.2, the rest repo choices recorded in the sheet):
# 50 nodes, 1500 m x 300 m, 802.11 at 2 Mbit/s, 300 m disk range, random
# waypoint 1-10 m/s, 900 s, 10 CBR flows of 64 B at 1 packet/s
# (`--scenario=paper`, v2.5.0's command lines with --runs/--firstRun for the
# seeds), pauses 0, 30, 120 and 600 s (four of the paper's seven, as v2.5.0).
# ARA and stock ns-3 AODV run in the same invocation, so every seed pairs them
# on the same mobility and traffic.
#
# Pre-registered on 2026-11-13 (#5, #105), before any dispatch. This plan
# supersedes tools/bench/campaigns/anchor.yaml (generation `anchor`,
# source_sha c7d6acb), which was never dispatched and is kept unchanged as the
# record: it named swarm-core 0919dbf, while its cells would have built on the
# commit benchmark-cell.yml names (#105). The maintainer was asked on
# 2026-11-13 "ARA #105: a new pre-registered anchor plan at the current
# swarm-core pin?" and answered "Yes to all five decisions, proceed". The
# trend, the cells, the seeds and the pass rule are the old plan's, unchanged:
# only the commits and the generation differ.
#
# The commits (tools/bench/check_plan_deps.py checks all three against
# benchmark-cell.yml at the dispatch ref, and the collected cells' ##PROV##
# with --cells):
#   - source_sha 274fd1de644ca1eda045807577b69b1e904822cb: main at the commit
#     that merges #111. Its core/CMakeLists.txt pins the swarm-core commit
#     below, and its merge-queue CI ran with it.
#   - swarm-core@501dd7eca8c530dadaeb5d43c66e9c31d19fd8f5
#   - routing-bench@3d279b83392a00288050574cee4288f30205658b
# Choice made here, the maintainer's to overrule: main before #111 lacks the
# 30 s dedup-history lifetime (#109), the commit that merges #111 has it. The
# anchor measures the accepted protocol behaviour (docs/fidelity.md "Ant and
# data dedup history size", decisions of 2026-11-10 and 2026-11-13), so the
# commit under test is the one with the lifetime. Overruling it is a new plan
# with another source_sha, as is any later run: never an edit of this one. A
# swarm-core or routing-bench bump in benchmark-cell.yml before the dispatch
# makes this plan stale in the same way (the check fails).
#
# One arm: the comparison is between two protocols in one cell, not between
# two commits. `reference: aodv` (swarm-routing/ns3-tools#152) makes
# `ns3-campaign verdicts` print ARA minus AODV, paired by seed, for every cell:
# the read the rule above takes. It is a read key: it changes no job.
#
#   P=tools/bench/campaigns/anchor-2.yaml
#   C="python3 ../ns3-tools/python/ns3_tool/campaign.py"   # or `ns3-campaign`
#   python3 -I tools/bench/check_plan_deps.py $P    # must end `plan deps: ok`, right before dispatch too
#   $C plan $P                                      # 8 jobs; dispatches nothing
#   $C dispatch $P --cap 4
#   $C status $P --brief
#   $C collect $P --out .campaign/anchor-2/cells
#   grep -ho '\(swarm-core\|routing-bench\)@[0-9a-f]*' .campaign/anchor-2/cells/*.txt | sort -u
#                                                   # 2 lines: one dependency set in every cell
#   python3 -I tools/bench/check_plan_deps.py $P --cells .campaign/anchor-2/cells   # ##PROV## against the plan; into #5
#   $C verdicts $P --dir .campaign/anchor-2/cells     # ara - aodv per cell: dPDR, d_d99, d_NRL paired 95% CIs
generation: anchor-2
ref: main
repo: swarm-routing/ARA
source_sha: 274fd1de644ca1eda045807577b69b1e904822cb
workflow: benchmark-cell.yml
program: routing-compare
# ns3-dev:3.48-optimized on 2026-11-13: AODV-family arms stay on 3.48 while
# ns-3.49's AODV livelocks (swarm-routing/ns3-containers#35; docs/fidelity.md).
image: ghcr.io/swarm-routing/ns3-dev@sha256:5585a93c5cea1980592539e2d26a4e111e0ff4b0cc63b3dfd6ea5de459d80d3f
# 8 jobs of 10 seeds; at most 4 cell runs at once, so PR CI keeps runners.
cap: 4
control: ara
# The baseline every other protocol of a cell is paired against in `verdicts`.
reference: aodv

arms:
  ara: ""

# 20 seeds per cell (RngRun 1..20) in two jobs of 10 (blocks: --firstRun=1
# and --firstRun=11), as v2.5.0 split its 900 s cells.
x-field: &field "--scenario=paper --nNodes=50 --time=900 --areaX=1500 --areaY=300 --speed=10 --flows=10 --runs=10 --diag --protocols=ara,aodv"
cells:
  # gated: PDR (ARA - AODV) CI > 0; NRL (ARA - AODV) CI < 0
  anchor-p0: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: *field, extraArgs: "--pause=0"}, blocks: [1, 11]}
  # gated: PDR (ARA - AODV) CI > 0
  anchor-p30: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: *field, extraArgs: "--pause=30"}, blocks: [1, 11]}
  # reported, not gated
  anchor-p120: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: *field, extraArgs: "--pause=120"}, blocks: [1, 11]}
  anchor-p600: {workflow: benchmark-cell.yml, inputs: {harness: routing-compare, args: *field, extraArgs: "--pause=600"}, blocks: [1, 11]}

jobs:
  - {arms: [ara], cells: "*"}
